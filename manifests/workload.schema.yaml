$schema: https://json-schema.org/draft/2020-12/schema
$id: https://omnimesh.io/schemas/workload/v1alpha1
type: object
additionalProperties: false
required: [apiVersion, kind, metadata, spec]
properties:
  apiVersion: {const: omnimesh.io/v1alpha1}
  kind: {const: Workload}
  metadata: {type: object, required: [name], properties: {name: {type: string}, tenant: {type: string}}}
  spec:
    type: object
    additionalProperties: false
    required: [image, command]
    properties:
      image: {type: string, description: Immutable OCI digest required for production}
      command: {type: array, items: {type: string}}
      replicas: {type: integer, minimum: 1, default: 1}
      privileged: {const: false}
      capabilities: {type: array, items: {type: string}}
